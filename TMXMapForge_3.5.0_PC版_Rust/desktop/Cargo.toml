[package]
name = "tmx-mapforge-desktop"
version = "3.5.0"
description = "铁锈战争地图生成器 · PC 版（Rust + Tauri 2，复用 Android 版前端与 Rust/WASM 生成引擎）"
authors = ["TMX MapForge"]
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "tmx-mapforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生「选择文件夹」对话框（导出目录设置）
rfd = "0.15"

[features]
# 直接 `cargo build --release` 时也以内嵌资源方式运行（不依赖开发服务器）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
